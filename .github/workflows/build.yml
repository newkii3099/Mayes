name: MAYES! Release Build

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install NDK / CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1" "platforms;android-36"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Release APK with Gradle
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} output_apk/MAYES-release-${{ github.run_number }}.apk \;
          ls -la output_apk/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAYES-release-v1.0.${{ github.run_number }}
          path: output_apk/*.apk
          retention-days: 30
